[theme]
primaryColor = "#ffffff"
backgroundColor = "#000000"
secondaryBackgroundColor = "#111111"
textColor = "#f4f4f5"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501
maxUploadSize = 2048

[client]
showErrorDetails = "full"

[logger]
level = "info"
messageFormat = "%(asctime)s [%(levelname)s] %(message)s"

